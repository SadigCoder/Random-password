<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <meta http-equiv="refresh" content="1"> -->
    <title>Random password</title>
    <link rel="stylesheet" href="5.css">
</head>
<body>
   <div class="settings-container app">
            <img src="settings.svg" alt="settings" class="settings-icon light-icon"
             id="settings-icon" fetchpriority="auto" >
         <div class="dropdown">
                <div id="history-container" class="history-box">
                <button id="delete-history-button">Delete History</button>
                <h3 class="history-title">Password History</h3>
                <ul id="history-list"></ul>
            </div>
         </div> 
    </div>      


     <div class="div-box">
            <div id="password-box"><div id="password-content"></div></div>

            <div id="generate-button" class="generate" title="Generate new password">
                <div id="generate-box">Generate password</div>
            </div>

            <div id="copy-button" class="copy" title="Copy to click">
                <div id="copy-box_part-1"></div>
                <div id="copy-box_part-2"></div>
            </div>

            <!-- if in div(copy-button) class == copied run this ↓↓ -->
            <div class="copied" id="copied">
                   ✓ copied
            </div>

            <!-- user length -->
            <div id="length-control">
                <label for="password-length" class="form-label">Password Length:</label>
                <input type="number" id="password-length" min="5" max="12" placeholder="Enter length (5-12)" group="length" error="Please enter a number between 5 and 12">
            </div>
     </div>
     <script src="5.js"></script>
</body>
</html>
